<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトダイアリー ライブラリ 375px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:375px;height:812px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;overflow:hidden">

<div style="height:48px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<button type="button" aria-label="メニュー" style="width:44px;height:44px;border:0;background:transparent;color:#211922;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>

<header style="padding:8px 16px 0;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></div>
<div style="flex:1 1 auto;min-width:0">
<h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700">フォトダイアリー</h1>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0">
<span style="flex-shrink:0;font-size:14px;color:#62625b">photos · 3,672枚</span>
<button type="button" aria-label="対象: すべての写真" style="display:inline-flex;align-items:center;gap:4px;min-width:0;min-height:44px;padding:4px 8px;margin-right:-8px;border:0;border-radius:12px;background:transparent;color:#62625b;font:inherit;font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">すべての写真</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
</div>
</div>
<nav aria-label="表示" style="display:flex;gap:24px;margin-top:8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<a href="Phone.dc.html" aria-current="page" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid #d63031;font-size:14px;font-weight:600;color:#211922">ライブラリ</a>
<a href="#" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">カレンダー</a>
<a href="#" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">地図</a>
</nav>
</header>

<div style="display:flex;align-items:center;gap:8px;padding:12px 16px 0">
<button type="button" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px;border:0;border-radius:12px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><path d="M14 4h7M14 9h7M14 15h7M14 20h7"/></svg><span style="font-weight:600">撮影月</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<button type="button" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px;border:0;border-radius:12px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>新しい順<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:28px">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="3">
<section style="min-width:0">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
<h2 style="margin:0;font-size:17px;font-weight:700">{{s.title}}</h2>
<span style="font-size:14px;color:#62625b">{{s.count}}</span>
<a href="Phone-Shelf.dc.html" style="margin-left:auto;display:inline-flex;align-items:center;gap:2px;min-height:32px;font-size:14px;color:#62625b">すべて見る<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
</div>
<div style="display:flex;gap:3px;height:120px;overflow:hidden">
<sc-for list="{{s.photos}}" as="p" hint-placeholder-count="3">
<div style="flex:{{p.grow}} 1 0;height:120px;border-radius:6px;background:{{p.bg}}"></div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#d9d4cb','#cdd5d1','#d8ccc6','#d2d3c6','#cfd1d8','#dccfc4'];
    const sets = [[1.33,0.75,1.0],[0.75,1.33,0.75],[1.5,1.33]];
    const row = (k) => sets[k].map((r, i) => ({ grow: String(r), bg: tones[(i + k * 2) % tones.length] }));
    return { shelves: [
      { title: '2026年11月', count: '124', photos: row(0) },
      { title: '2026年10月', count: '251', photos: row(1) },
      { title: '2026年9月', count: '87', photos: row(2) }
    ] };
  }
}
</script>
</body>
</html>
