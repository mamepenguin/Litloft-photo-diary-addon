<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトダイアリー ライブラリ タグ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:1280px;height:900px;box-sizing:border-box;background:#ffffff;color:#211922;font-family:-apple-system,system-ui,'Segoe UI',Roboto,'Helvetica Neue','ヒラギノ角ゴ Pro W3',Meiryo,sans-serif;display:flex;overflow:hidden;position:relative">

<aside style="width:240px;flex-shrink:0;background:#f6f6f3;border-right:1px solid rgba(145,145,140,0.2)"></aside>

<main style="flex:1 1 auto;min-width:0">
<header style="padding:8px 16px 0;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;align-items:flex-start;gap:12px">
<div style="width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#f6f6f3;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></div>
<div style="flex:1 1 auto;min-width:0">
<h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700">フォトダイアリー</h1>
<div style="margin-top:4px;font-size:14px;color:#62625b">photos · 3,672枚</div>
</div>
<button type="button" aria-label="対象: すべての写真" style="display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 8px;border:0;border-radius:12px;background:transparent;color:#62625b;font:inherit;font-size:14px;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>すべての写真</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<nav aria-label="表示" style="display:flex;gap:24px;margin-top:8px;border-bottom:1px solid rgba(145,145,140,0.2)">
<a href="Main.dc.html" aria-current="page" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid #d63031;font-size:14px;font-weight:600;color:#211922">ライブラリ</a>
<a href="#" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">カレンダー</a>
<a href="#" style="padding:10px 4px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14px;color:#62625b">地図</a>
</nav>
</header>

<div style="display:flex;align-items:center;gap:8px;padding:16px 16px 0">
<button type="button" aria-expanded="true" style="display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:0;border-radius:12px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><path d="M14 4h7M14 9h7M14 15h7M14 20h7"/></svg><span style="color:#62625b">分類</span><span style="font-weight:600">タグ</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<button type="button" style="display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:0;border-radius:12px;background:#e5e5e0;color:#211922;font:inherit;font-size:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>新しい順<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<div role="menu" aria-label="分類" style="position:absolute;left:256px;top:176px;width:220px;padding:6px;border-radius:14px;background:#ffffff;box-shadow:0 8px 28px rgba(33,25,34,0.16);border:1px solid rgba(145,145,140,0.2);z-index:2">
<div style="padding:6px 10px;font-size:12px;color:#62625b">分類</div>
<sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
<button type="button" role="menuitemradio" aria-checked="{{m.on}}" style="display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:{{m.bg}};color:#211922;font:inherit;font-size:14px;text-align:left"><span style="width:16px;display:flex">{{m.mark}}</span>{{m.label}}</button>
</sc-for>
</div>

<div style="padding:24px 16px 0;display:flex;flex-direction:column;gap:36px">
<sc-for list="{{shelves}}" as="s" hint-placeholder-count="3">
<section style="min-width:0">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px">
<h2 style="margin:0;font-size:18px;font-weight:700">{{s.title}}</h2>
<span style="font-size:14px;color:#62625b">{{s.count}}</span>
<a href="Shelf.dc.html" style="margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:14px;color:#62625b">すべて見る<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
</div>
<div style="display:flex;gap:8px;height:200px">
<sc-for list="{{s.photos}}" as="p" hint-placeholder-count="5">
<div style="flex:{{p.grow}} 1 0;height:200px;border-radius:6px;background:{{p.bg}}"></div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#cdd5d1','#d9d4cb','#cfd1d8','#d8ccc6','#dccfc4','#d2d3c6','#d6cfd8','#c9d3cb'];
    const ratios = [[1.5,1.33,0.75,1.33,0.75],[1.33,0.75,0.75,1.5,1.33],[0.75,1.78,1.33,0.75,1.33]];
    const row = (k) => ratios[k].map((r, i) => ({ grow: String(r), bg: tones[(i + k * 2) % tones.length] }));
    const menu = [['撮影月', false], ['タグ', true], ['コレクション', false], ['フォルダ', false]].map(([label, on]) => ({ label, on: on ? 'true' : 'false', mark: on ? '✓' : '', bg: on ? '#f6f6f3' : 'transparent' }));
    return { menu, shelves: [
      { title: '旅行', count: '412', photos: row(0) },
      { title: '家族', count: '388', photos: row(1) },
      { title: 'タグなし', count: '2,871', photos: row(2) }
    ] };
  }
}
</script>
</body>
</html>
